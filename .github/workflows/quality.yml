name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
      - name: Lint, tests and Release app
        run: ./scripts/check.sh
      - name: Offline diagrams, PDF and reopen
        run: swift run StudyQA --data-dir "$RUNNER_TEMP/baeuja-qa" --render-demo --stress-pdf --reopen
      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: quality-logs
          path: work/quality/
          retention-days: 7
