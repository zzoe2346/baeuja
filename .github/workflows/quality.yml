name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint, tests and Release app
        run: ./scripts/check.sh
      - name: Offline diagrams, PDF and reopen
        run: swift run StudyQA --data-dir "$RUNNER_TEMP/study-swift-qa" --render-demo --stress-pdf --reopen
      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-logs
          path: work/quality/
          retention-days: 7
